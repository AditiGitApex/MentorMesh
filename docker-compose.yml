services:
  postgres:
    image: postgres:17-alpine
    container_name: mentormesh-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mentormesh
      POSTGRES_PASSWORD: mentormesh_dev
      POSTGRES_DB: mentormesh
    volumes:
      - mentormesh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentormesh -d mentormesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentormesh_pg:
